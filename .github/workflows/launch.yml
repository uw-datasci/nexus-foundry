name: Foundry Launch

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "New repository name (kebab-case)"
        required: true
        type: string
      team_access:
        description: "GitHub team slug"
        required: true
        type: string
      project_type:
        description: "Template repository name"
        required: true
        type: string
      database:
        description: "Database choice (postgres|mongodb)"
        required: true
        type: string
      postgres_provider:
        description: "When database is postgres: supabase or neon"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - supabase
          - neon
      mongo_client:
        description: "When database is mongodb: mongodb (driver) or mongoose"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - mongodb
          - mongoose
      redis:
        description: "Enable Redis (true|false)"
        required: false
        default: "false"
        type: string
      s3:
        description: "Enable S3/R2 (true|false)"
        required: false
        default: "false"
        type: string
      domain:
        description: "Production hostname for Vercel"
        required: true
        type: string

  repository_dispatch:
    types: [foundry-launch]

permissions:
  contents: write
  actions: read

env:
  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_ID }}
  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_TOKEN }}
  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: nexus-queue
    outputs:
      project_name: ${{ steps.payload.outputs.project_name }}
      team_access: ${{ steps.payload.outputs.team_access }}
      project_type: ${{ steps.payload.outputs.project_type }}
      database: ${{ steps.payload.outputs.database }}
      postgres_provider: ${{ steps.payload.outputs.postgres_provider }}
      mongo_client: ${{ steps.payload.outputs.mongo_client }}
      redis: ${{ steps.payload.outputs.redis }}
      s3: ${{ steps.payload.outputs.s3 }}
      domain: ${{ steps.payload.outputs.domain }}
      has_api: ${{ steps.derive.outputs.has_api }}
      uses_raft_sdk: ${{ steps.derive.outputs.uses_raft_sdk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve client payload
        id: payload
        shell: bash
        run: |
          echo "project_name=${{ inputs.project_name }}" >> "$GITHUB_OUTPUT"
          echo "team_access=${{ inputs.team_access }}" >> "$GITHUB_OUTPUT"
          echo "project_type=${{ inputs.project_type }}" >> "$GITHUB_OUTPUT"
          echo "database=${{ inputs.database }}" >> "$GITHUB_OUTPUT"
          echo "postgres_provider=${{ inputs.postgres_provider }}" >> "$GITHUB_OUTPUT"
          echo "mongo_client=${{ inputs.mongo_client }}" >> "$GITHUB_OUTPUT"
          echo "redis=${{ inputs.redis }}" >> "$GITHUB_OUTPUT"
          echo "s3=${{ inputs.s3 }}" >> "$GITHUB_OUTPUT"
          echo "domain=${{ inputs.domain || github.event.client_payload.domain }}" >> "$GITHUB_OUTPUT"

      - name: Derive template capabilities
        id: derive
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.payload.outputs.project_type }}
        run: |
          node -e "const{getTemplate}=require('./.github/lib/templates.js');const t=getTemplate(process.env.PROJECT_TYPE);const out=process.env.GITHUB_OUTPUT;require('fs').appendFileSync(out,'has_api='+(t&&t.hasApi?'true':'false')+'\n');require('fs').appendFileSync(out,'uses_raft_sdk='+(t&&t.usesRaftSdk?'true':'false')+'\n')"

      - name: Log request (placeholder)
        run: |
          echo "Project: ${{ steps.payload.outputs.project_name }}"
          echo "Team: ${{ steps.payload.outputs.team_access }}"
          echo "Template: ${{ steps.payload.outputs.project_type }}"
          echo "Database: ${{ steps.payload.outputs.database }}"
          echo "Postgres provider: ${{ steps.payload.outputs.postgres_provider }}"
          echo "Mongo client: ${{ steps.payload.outputs.mongo_client }}"
          echo "Redis: ${{ steps.payload.outputs.redis }}"
          echo "S3: ${{ steps.payload.outputs.s3 }}"
          echo "Domain: ${{ steps.payload.outputs.domain }}"

  create_repo:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create repository from template
        env:
          GH_TOKEN: ${{ secrets.FOUNDRY_GITHUB_TOKEN }}
          TARGET_ORG: ${{ github.repository_owner }}
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          TEAM_ACCESS: ${{ needs.setup.outputs.team_access }}
        run: node .github/scripts/create_repo.js

  register_raft_consumer:
    runs-on: ubuntu-latest
    needs: [setup, create_repo]
    if: needs.setup.outputs.uses_raft_sdk == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Register as raft-context-sync consumer
        env:
          TARGET_ORG: ${{ github.repository_owner }}
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
        run: node .github/scripts/register_raft_consumer.js

  secrets_setup:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Infisical secrets folder
        uses: actions/github-script@v9
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/secrets_setup.js");
            await main();

  db_setup:
    runs-on: ubuntu-latest
    needs: [setup, create_repo, secrets_setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision database
        uses: actions/github-script@v9
        env:
          DATABASE: ${{ needs.setup.outputs.database }}
          POSTGRES_PROVIDER: ${{ needs.setup.outputs.postgres_provider }}
          MONGO_CLIENT: ${{ needs.setup.outputs.mongo_client }}
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/db_setup.js");
            await main();

  redis_setup:
    runs-on: ubuntu-latest
    needs: [setup, create_repo, secrets_setup]
    if: needs.setup.outputs.redis == 'true'
    steps:
      - name: Setup Redis
        run: |
          echo "Redis setup"

  s3_setup:
    runs-on: ubuntu-latest
    needs: [setup, create_repo, secrets_setup]
    if: needs.setup.outputs.s3 == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision Cloudflare R2 buckets and push secrets
        uses: actions/github-script@v9
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/s3_setup.js");
            await main();

  vercel_setup:
    runs-on: ubuntu-latest
    needs: [setup, db_setup, redis_setup, s3_setup]
    if: |
      always() &&
      needs.db_setup.result == 'success' &&
      (needs.redis_setup.result == 'success' || needs.redis_setup.result == 'skipped') &&
      (needs.s3_setup.result == 'success' || needs.s3_setup.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Vercel project and Infisical secret syncs
        uses: actions/github-script@v9
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          DOMAIN: ${{ needs.setup.outputs.domain }}
          GITHUB_ORG: ${{ github.repository_owner }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          INFISICAL_VERCEL_CONNECTION_ID: ${{ secrets.INFISICAL_VERCEL_CONNECTION_ID }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/vercel_setup.js");
            await main();

  config:
    runs-on: ubuntu-latest
    needs: [setup, create_repo, vercel_setup]
    outputs:
      commit_sha: ${{ steps.apply.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply static configuration to generated repo
        id: apply
        uses: actions/github-script@v9
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          DATABASE: ${{ needs.setup.outputs.database }}
          POSTGRES_PROVIDER: ${{ needs.setup.outputs.postgres_provider }}
          MONGO_CLIENT: ${{ needs.setup.outputs.mongo_client }}
          S3: ${{ needs.setup.outputs.s3 }}
          GITHUB_ORG: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.FOUNDRY_GITHUB_TOKEN }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/config.js");
            await main();

  render_setup:
    runs-on: ubuntu-latest
    needs: [setup, config]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Render web service and Infisical secret syncs
        uses: actions/github-script@v9
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          GITHUB_ORG: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.FOUNDRY_GITHUB_TOKEN }}
          CONFIG_COMMIT_SHA: ${{ needs.config.outputs.commit_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          RENDER_PROJECT_ID: ${{ secrets.RENDER_PROJECT_ID }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          INFISICAL_RENDER_CONNECTION_ID: ${{ secrets.INFISICAL_RENDER_CONNECTION_ID }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/render_setup.js");
            await main();
