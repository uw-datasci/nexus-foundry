name: Foundry Launch

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "New repository name (kebab-case)"
        required: true
        type: string
      team_access:
        description: "GitHub team slug"
        required: true
        type: string
      project_type:
        description: "Template repository name"
        required: true
        type: string
      database:
        description: "Database choice (postgres|mongodb)"
        required: true
        type: string
      postgres_provider:
        description: "When database is postgres: supabase or neon"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - supabase
          - neon
      mongo_client:
        description: "When database is mongodb: mongodb (driver) or mongoose"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - mongodb
          - mongoose
      redis:
        description: "Enable Redis (true|false)"
        required: false
        default: "false"
        type: string
      s3:
        description: "Enable S3/R2 (true|false)"
        required: false
        default: "false"
        type: string
      description:
        description: "Project description"
        required: false
        type: string
      domain:
        description: "Production hostname for Vercel"
        required: true
        type: string

  repository_dispatch:
    types: [ foundry-launch ]

permissions:
  contents: write
  actions: read

env:
  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_ID }}
  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_TOKEN }}
  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: nexus-queue
    outputs:
      project_name: ${{ steps.payload.outputs.project_name }}
      team_access: ${{ steps.payload.outputs.team_access }}
      project_type: ${{ steps.payload.outputs.project_type }}
      database: ${{ steps.payload.outputs.database }}
      postgres_provider: ${{ steps.payload.outputs.postgres_provider }}
      mongo_client: ${{ steps.payload.outputs.mongo_client }}
      redis: ${{ steps.payload.outputs.redis }}
      s3: ${{ steps.payload.outputs.s3 }}
      description: ${{ steps.payload.outputs.description }}
      domain: ${{ steps.payload.outputs.domain }}
    steps:
      - name: Resolve client payload
        id: payload
        shell: bash
        run: |
          echo "project_name=${{ inputs.project_name }}" >> "$GITHUB_OUTPUT"
          echo "team_access=${{ inputs.team_access }}" >> "$GITHUB_OUTPUT"
          echo "project_type=${{ inputs.project_type }}" >> "$GITHUB_OUTPUT"
          echo "database=${{ inputs.database }}" >> "$GITHUB_OUTPUT"
          echo "postgres_provider=${{ inputs.postgres_provider }}" >> "$GITHUB_OUTPUT"
          echo "mongo_client=${{ inputs.mongo_client }}" >> "$GITHUB_OUTPUT"
          echo "redis=${{ inputs.redis }}" >> "$GITHUB_OUTPUT"
          echo "s3=${{ inputs.s3 }}" >> "$GITHUB_OUTPUT"
          echo "description=${{ inputs.description }}" >> "$GITHUB_OUTPUT"
          echo "domain=${{ inputs.domain || github.event.client_payload.domain }}" >> "$GITHUB_OUTPUT"

      - name: Log request (placeholder)
        run: |
          echo "Project: ${{ steps.payload.outputs.project_name }}"
          echo "Team: ${{ steps.payload.outputs.team_access }}"
          echo "Template: ${{ steps.payload.outputs.project_type }}"
          echo "Database: ${{ steps.payload.outputs.database }}"
          echo "Postgres provider: ${{ steps.payload.outputs.postgres_provider }}"
          echo "Mongo client: ${{ steps.payload.outputs.mongo_client }}"
          echo "Redis: ${{ steps.payload.outputs.redis }}"
          echo "S3: ${{ steps.payload.outputs.s3 }}"
          echo "Description: ${{ steps.payload.outputs.description }}"
          echo "Domain: ${{ steps.payload.outputs.domain }}"

  create_repo:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create repository from template
        env:
          GH_TOKEN: ${{ secrets.FOUNDRY_GITHUB_TOKEN }}
          TARGET_ORG: ${{ github.repository_owner }}
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          PROJECT_TYPE: ${{ needs.setup.outputs.project_type }}
          DESCRIPTION: ${{ needs.setup.outputs.description }}
          TEAM_ACCESS: ${{ needs.setup.outputs.team_access }}
        run: node .github/scripts/create_repo.js

  secrets_setup:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Infisical secrets folder
        uses: actions/github-script@v8
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/secrets_setup.js");
            await main();

  db_setup:
    runs-on: ubuntu-latest
    needs: [ setup, create_repo, secrets_setup ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision database
        uses: actions/github-script@v8
        env:
          DATABASE: ${{ needs.setup.outputs.database }}
          POSTGRES_PROVIDER: ${{ needs.setup.outputs.postgres_provider }}
          MONGO_CLIENT: ${{ needs.setup.outputs.mongo_client }}
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/db_setup.js");
            await main();

  # redis_setup:
  #   runs-on: ubuntu-latest
  #   needs: [setup, create_repo, secrets_setup]
  #   steps:
  #     - name: Setup Redis
  #       run: |
  #         echo "Redis setup"

  # s3_setup:
  #   runs-on: ubuntu-latest
  #   needs: [setup, create_repo, secrets_setup]
  #   steps:
  #     - name: Setup S3
  #       run: |
  #         echo "S3 setup"

  vercel_setup:
    runs-on: ubuntu-latest
    needs: [ setup, create_repo, secrets_setup, db_setup ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Vercel project and Infisical secret syncs
        uses: actions/github-script@v8
        env:
          PROJECT_NAME: ${{ needs.setup.outputs.project_name }}
          DOMAIN: ${{ needs.setup.outputs.domain }}
          GITHUB_ORG: ${{ github.repository_owner }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          INFISICAL_VERCEL_CONNECTION_ID: ${{ secrets.INFISICAL_VERCEL_CONNECTION_ID }}
        with:
          script: |
            const { main } = require("${{ github.workspace }}/.github/scripts/vercel_setup.js");
            await main();
